# Pre-commit controls for the Encrypted Chat Application.
#
# Install once per clone:   pre-commit install
# Run against everything:   pre-commit run --all-files
#
# Tool selection note: Ruff provides both linting and formatting for Python,
# so no separate Black/isort/flake8 hooks are configured — that would be
# overlapping tooling. Gitleaks is the single secret scanner.

default_language_version:
  python: python3

repos:
  # --- General file hygiene ------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # TypeScript's tsconfig files are JSONC (comments are valid and are
        # used by the Vite template). This hook is strict JSON only; `tsc -b`
        # validates those files instead. No other JSON is exempt.
        exclude: ^client/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes deliberately checks Windows script files out as CRLF
        # so they run reliably on Windows. Without this exclusion the hook
        # rewrites them to LF on every fresh clone, so `pre-commit run
        # --all-files` fails immediately after cloning.
        exclude: \.(ps1|bat|cmd)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      # Security-relevant hygiene: block accidental key/credential commits.
      - id: detect-private-key
      - id: check-case-conflict

  # --- Python lint + format (Ruff replaces flake8/black/isort) -------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^server/
      - id: ruff-format
        files: ^server/

  # --- Secret scanning (SUPPLY-004) ---------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
