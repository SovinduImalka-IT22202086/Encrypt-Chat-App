[project]
name = "encrypted-chat-server"
version = "0.1.0"
description = "Encrypted Chat Application — backend (Phase 1 development scaffold only)"
requires-python = ">=3.11"

# NOTE: Runtime dependencies are pinned in requirements.txt (compiled from
# requirements.in). This file intentionally does not duplicate the dependency
# list — see docs/PHASE_1_EVIDENCE.md for the locking strategy rationale.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [".venv", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
# Security-oriented but not obstructive. `S` is flake8-bandit (security),
# which is the reason this set is broader than a default Ruff configuration.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (supports mypy strictness)
    "ASYNC",# flake8-async
    "T20",  # flake8-print (no stray print() in server code)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN401",  # Allow `Any` where genuinely required; mypy still flags misuse.
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and need not annotate every fixture return.
"tests/**/*.py" = ["S101", "ANN201", "ANN001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
exclude = ['^\.venv/']
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
# Async tests are opt-in via @pytest.mark.asyncio (strict mode), so a plain
# `async def` that is never awaited fails loudly instead of silently passing.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Warnings are errors so deprecations in OUR code fail the build rather than
# accumulating silently. Exceptions below are narrowly scoped to a specific
# third-party message and must be re-checked when dependencies are upgraded.
filterwarnings = [
    "error",
    # starlette.testclient imports a deprecated anyio alias on import. Not
    # fixable from this repository; scoped to the exact message so our own
    # DeprecationWarnings still fail. Remove when starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
