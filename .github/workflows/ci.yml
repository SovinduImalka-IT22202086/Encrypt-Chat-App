name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, mypy, pytest, pip-audit)
    # Windows is the project's primary development platform, so the backend
    # checks run there to match the documented developer workflow.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy (static type check)
        run: mypy .

      - name: pytest
        run: pytest

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (ESLint, tsc, Vitest, build, npm audit)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative.
      - name: Install from lockfile
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Production build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
